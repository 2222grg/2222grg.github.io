<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSCURA | 詭譎時尚</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 導覽列 -->
    <nav class="navbar">
        <div class="logo">OBSCURA</div>
        <ul class="nav-links">
            <li><a href="#home">首頁</a></li>
            <li><a href="#editorial">專題</a></li>
            <li><a href="#gallery">畫廊</a></li>
        </ul>
        <button class="nav-btn">訂閱</button>
    </nav>

    <!-- 主視覺區塊 -->
    <header id="home" class="hero">
        <div class="hero-content">
            <h1 class="glitch-text" data-text="ECHOES OF THE ABYSS">ECHOES OF THE ABYSS</h1>
            <p>在光影交錯的邊緣，尋找絕對的純粹與瘋狂。</p>
            <button class="cta-btn">探索深淵</button>
        </div>
        <div class="hero-overlay"></div>
    </header>

    <!-- 雜誌文章區塊 -->
    <section id="editorial" class="editorial-section">
        <h2 class="section-title">LATEST EDITORIAL</h2>
        <div class="editorial-grid">
            <article class="card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=800&auto=format&fit=crop');"></div>
                <div class="card-content">
                    <h3>蒼白凝視</h3>
                    <p>當眼眸失去色彩，時尚成為了靈魂的囚籠。</p>
                    <a href="#" class="read-more">閱讀更多 <span>→</span></a>
                </div>
            </article>
            <article class="card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=800&auto=format&fit=crop');"></div>
                <div class="card-content">
                    <h3>夜之囈語</h3>
                    <p>天鵝絨與暗殺者的低語，交織在午夜的巴黎街頭。</p>
                    <a href="#" class="read-more">閱讀更多 <span>→</span></a>
                </div>
            </article>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer class="footer">
        <h2>OBSCURA</h2>
        <p>© 2026 OBSCURA MAGAZINE. ALL RIGHTS RESERVED.</p>
        <p class="disclaimer">擁抱黑暗，方能看見繁星。</p>
    </footer>

</body>
</html>
