<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AS06 捲動練習</title>
  <!-- 引入 jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    /* 網頁本身剛好一個畫面高，捲動交給 #wrap（手機和內嵌網頁都比較穩） */
    html { box-sizing: border-box; height: 100%; background: #264653; color-scheme: light; }
    body { height: 100%; margin: 0; overflow: hidden; }
    #wrap { position: relative; height: 100%; overflow-y: auto; }

    /* 每一頁都是 100vh（這裡用 100% = #wrap 的高度 = 一個畫面高） */
    .page {
      height: 100%;
      display: flex;              /* 讓文字置中 */
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-size: 48px;
      color: #fff;
      font-family: sans-serif;
    }
    .page small { font-size: 22px; margin-top: 12px; }

    /* 【吸頂關鍵 1】外層 div：它有多高，裡面那頁就會被「釘住」多久
       300vh = 釘住的頁面本身 100vh + 再捲 200vh 才離開
       想讓讀者看久一點就改大（例如 400vh），想快一點就改小 */
    .parent {
      height: 300%;
    }

    /* 【吸頂關鍵 2】裡面的頁面設定 sticky，捲到頂端就黏住 */
    .sticky {
      position: sticky;
      top: 0;
      height: 33.334%;            /* 外層的 1/3 = 一個畫面高（100vh） */
    }

    /* 【第 4 頁】一樣 sticky-top，頁面本身 100vh
       外層只比它多一個畫面（200vh）：推到頂端後黏住一下，再被第 5 頁正常推走
       （沒有外層的話，第 4 頁會一路黏到底，第 5 頁就永遠看不到） */
    .parent4 { height: 200%; }
    #p4 {
      position: sticky;
      top: 0;
      height: 50%;                /* 外層的一半 = 一個畫面高（100vh） */
    }

    /* 五種不同顏色 */
    #p1 { background: #e76f51; }
    #p2 { background: #2a9d8f; }
    #p3 { background: #264653; }
    #p4 { background: #8e44ad; }
    #p5 { background: #f4a261; }

    /* 吸頂頁裡的進度條：顯示「還要捲多少才會離開這頁」 */
    .bar {
      width: 60%;
      height: 8px;
      margin-top: 24px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.3);
      overflow: hidden;
    }
    .bar span {
      display: block;
      width: 0%;
      height: 100%;
      background: #fff;
    }
  </style>
</head>
<body>

  <div id="wrap">
    <div class="page" id="p1">第 1 頁<small>正常捲動</small></div>

    <!-- 外層 parent 包住第 2 頁，第 2 頁會黏在頂端，直到外層捲完 -->
    <div class="parent">
      <div class="page sticky" id="p2">第 2 頁<small>吸頂捲動</small><div class="bar"><span></span></div></div>
    </div>

    <div class="page" id="p3">第 3 頁<small>正常捲動</small></div>

    <!-- 第 4 頁：sticky-top，黏住一個畫面後被第 5 頁推走 -->
    <div class="parent4">
      <div class="page" id="p4">第 4 頁<small>吸頂捲動</small></div>
    </div>

    <div class="page" id="p5">第 5 頁<small>正常捲動</small></div>
  </div>

  <script>
    // 吸頂效果由上面的 CSS sticky 完成，不攔截任何捲動，所以往上、往下都很順
    // jQuery 負責「監聽讀者捲到哪裡」，更新吸頂頁裡的進度條
    $(function () {
      var $wrap = $('#wrap');

      $wrap.on('scroll', function () {
        var now = $wrap.scrollTop();         // 目前捲到哪
        var screen = $wrap.innerHeight();    // 一個畫面的高度

        $('.parent').each(function () {
          var start = this.offsetTop;                    // 開始黏住的位置
          var length = this.offsetHeight - screen;       // 黏住期間可以捲的距離
          var progress = (now - start) / length;         // 0 = 剛黏住，1 = 準備離開
          progress = Math.min(1, Math.max(0, progress)); // 限制在 0～1 之間
          $(this).find('.bar span').css('width', progress * 100 + '%');
        });

      });
    });
  </script>
</body>
</html>
